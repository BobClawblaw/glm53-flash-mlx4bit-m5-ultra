# Copy to local.toml (git-ignored) and set this Mac's values. Any [section] from recipe.toml may appear here.
[local]
host = "127.0.0.1"               # 0.0.0.0 serves the network (set api_key too if it is shared)
port = 8888

[engine]
zig = "~/.local/zig/zig"         # Zig 0.17.0, wherever it is installed

[serve]
profile = "chat"
temperature = ""                 # "" the checkpoint's sampling; "0" greedy by default
