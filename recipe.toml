# The recipe's defaults. `local.toml` next to this file overrides them for this Mac (copy local.example.toml); an
# environment variable of the same name in upper case overrides both (PORT=8090 python3 -m mac up).

[model]
repo = "TensorFold/GLM-5.3-Flash-MLX-4bit-MTP"
revision = "d2b17f5253440224422b150705c1109a9a3a0368"
served_name = "GLM-5.3-Flash-MLX-4bit"
same_as = ""                              # other repositories whose snapshot at this revision is the same tree (comma-separated)

[engine]
tensorfold_repo = "https://github.com/ashhart/TensorFold.git"
tensorfold_sha = "8be9c408c2825102b475dc6049c6aa3cf5d9e910"     # v1.2.5, as released: no patch
tensorfold_src = "~/github/TensorFold"   # a checkout holding the sha; `build` adds a worktree at it under tf_cache
# A patch applied to the worktree before the build, pinned by sha256 (never edit one in place: write a new one and
# re-pin). Empty: the release as it is. The 1.0.5 line's patch (one-Mac vision tower, shared pool, wired reads) is
# not carried: 1.2.5 pools the window and wires the model itself, serves any temperature, and has no GLM vision on Metal.
patch = ""
patch_sha256 = ""
zig = "~/.local/zig/zig"                 # Zig 0.17.0 (.zig-version in the checkout)
zig_cpu = "apple_m1"
binary = ""                              # a prebuilt tensorfold-native to serve with instead of the pinned build

[local]
host = "127.0.0.1"
port = 8888                      # 8080 is taken by everything else
hf_cache = "~/.cache/huggingface"
tf_cache = "~/.cache/tensorfold-glm53"
request_log = ""                         # a file for TENSORFOLD_REQUEST_LOG; empty logs no requests

[serve]
profile = "chat"                 # chat (MTP drafts) | reference (--no-drafts, the exactness reference)
# the window: the checkpoint's full 1,048,576. The streams share the engine's cache pool of this many tokens: one
# request alone can use all of it, several split it, each taking its prompt plus max_tokens while it runs
context = 1048576
parallel = 3                     # streams at once, sharing decode rounds and the pool
drafts = true                    # the checkpoint's MTP head (loaded only inside memory_limit_gb: 180.6 GB with it)
reasoning_effort = "high"        # GLM-5.3's levels: low, high, max; "" leaves the template's default, max
thinking = true                  # GLM-5.3 reasons first (reasoning_content); a request can send chat_template_kwargs {"enable_thinking": false}
max_tokens = 32768
temperature = ""                 # the server's default for requests that send none: "" the checkpoint's (1.0, top_p 0.95); "0" greedy
prompt_cache_gib = 4             # kept prompt states, bounded so the load stays predictable; -1 the engine's default, 0 off
learn = false                    # shared prompt prefixes on disk; learn_dir and learn_gib below
learn_dir = ""                   # "" the engine's ~/.cache/tensorfold/learned
learn_gib = 32
keep_warm = 900
compact_at = ""
dashboard = true
# images: 1.2.5 has no --vision for GLM on Metal (an image_url part answers 400); the setting is refused when true
vision = false
vision_image_tokens = 4096
vision_max_images = 4
api_key = ""
extra_args = ""
extra_env = ""
# memory: the engine refuses a one-Mac load past GLM_LOAD_LIMIT_GB (unset: 70% of RAM, 179.2 GB on 256, which drops
# the 180.6 GB load with the MTP head). 215 GB holds the weights, the 1M-token pool, three streams' own states and the
# kept prompt states (190.9 GiB wired at idle); `up` also refuses when free memory is under the engine's floor plus
# memory_margin_gib, and the watchdog below kills the server before the Mac swaps.
memory_limit_gb = 215
residency = true                 # the engine's residency set over the weights (GLM_RESIDENCY=0 when false): kept wired between requests
# macOS's GPU wired ceiling (sysctl iogpu.wired_limit_mb; 0 is the default, about 75% of RAM): under it the wired
# collector evicts parts of the model mid-request and the same greedy reply swings between 7 and 107 tok/s, residency
# set or not. `up` refuses when the sysctl is under this value and prints the command (it resets at reboot); 0 skips the check
wired_limit_mb = 225000
memory_margin_gib = 8
memguard = true
memguard_min_free_gib = 6        # free + inactive + speculative pages
memguard_max_swap_growth_mb = 12288 # backstop: swap growth since start (a healthy load pages ~3 GB of other apps out);
                                    # macOS's critical pressure level for 30 s also kills
memguard_max_compressor_growth_gib = 24  # the compressor's growth: with the model wired nothing of it compresses, so
                                         # growth is other memory squeezed (kills after two readings)

[profiles.chat]
drafts = true

[profiles.reference]
drafts = false
memory_limit_gb = 215

# The Spark recipe's quality suite and decode ruler run against any OpenAI-compatible URL. `python3 -m mac suite|ruler`
# clones it at this commit under .external/ (git-ignored) and runs them there; nothing of it is copied into this tree.
[external]
spark_recipe_repo = "https://github.com/BobClawblaw/qwen38-flashnext-int4mixed-2x-dgx-sparks.git"
spark_recipe_sha = "8a7f4c80f146aeb14eaf7a7002cb07b5ad2fef53"
